<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tabnotes - settings</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="header">
    <h1>Settings</h1>
    <button id="all-notes" type="button">All notes</button>
  </header>
  <p id="error" class="error" hidden>Could not load settings</p>
  <div class="field">
    <label for="default-title">Default title for new notes</label>
    <input id="default-title" type="text" placeholder="Notes" aria-describedby="title-hint" disabled>
    <small id="title-hint" class="title-hint"></small>
  </div>
  <label class="field">
    <span>Notes created by the toolbar button</span>
    <select id="new-notes" disabled>
      <option value="permanent">Permanent</option>
      <option value="temporary">Temporary</option>
    </select>
  </label>
  <label class="field">
    <span>Note font size (px)</span>
    <input id="font-size" type="number" min="10" max="32" step="1" disabled>
  </label>
  <label class="field">
    <span>Theme</span>
    <select id="theme" disabled>
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <div class="field" role="group" aria-labelledby="transfer-label">
    <span id="transfer-label">Export and import</span>
    <div class="transfer">
      <button id="export-notes" type="button" disabled>Export all notes</button>
      <button id="import-notes" type="button" disabled>Import...</button>
    </div>
    <input id="import-file" type="file" accept=".zip,.md" multiple hidden>
    <small id="transfer-status" class="transfer-status" aria-live="polite"></small>
  </div>
  <div class="field">
    <span>Welcome note</span>
    <div class="welcome">
      <button id="welcome-note" type="button">Open the welcome note</button>
    </div>
    <small id="welcome-status" class="welcome-status" aria-live="polite"></small>
  </div>
  <script src="options.js"></script>
</body>
</html>
