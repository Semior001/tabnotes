<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tabnotes - settings</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="header">
    <h1>Settings</h1>
    <button id="all-notes" type="button">All notes</button>
  </header>
  <p id="error" class="error" hidden>Could not load settings</p>
  <label class="field">
    <span>Default title for new notes</span>
    <input id="default-title" type="text" placeholder="Notes" disabled>
    <small id="title-hint"></small>
  </label>
  <label class="field">
    <span>Note font size (px)</span>
    <input id="font-size" type="number" min="10" max="32" step="1" disabled>
  </label>
  <label class="field">
    <span>Theme</span>
    <select id="theme" disabled>
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <script src="options.js"></script>
</body>
</html>
